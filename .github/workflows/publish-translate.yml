name: publish translate

# Publishes tools/translations as @clice-io/translate when a release tag
# (vX.Y.Z) is pushed; the moving major tag (v1) publishes nothing. Without
# the NPM_TOKEN secret the publish is skipped with a notice; once it is set,
# re-run the skipped run, or dispatch this workflow on the tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NPM_TOKEN is not set; skipping the npm publish of @clice-io/translate"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: tools/translations
    steps:
      - name: Check the ref is a release tag
        working-directory: .
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::run this workflow on a release tag (vX.Y.Z), not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: |
          npm run check
          npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm run build
          npm publish --access public --provenance
